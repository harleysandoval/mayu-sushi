<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario diario</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f6fb;--paper:#fff;--ink:#14213d;--muted:#5b6b8a;--line:#c9d4e8;--band:#d6e2f5;--head:#2c4a8a;--headtx:#fff;--accent:#1d4ed8;--danger:#b42318;--ok:#157347;--inbg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--paper:#152038;--ink:#e6ecf8;--muted:#93a3c4;--line:#2b3b5e;--band:#1f2f52;--head:#274277;--accent:#7aa2ff;--danger:#ff8a80;--ok:#6fdc9c;--inbg:#0f1830;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--paper:#152038;--ink:#e6ecf8;--muted:#93a3c4;--line:#2b3b5e;--band:#1f2f52;--head:#274277;--accent:#7aa2ff;--danger:#ff8a80;--ok:#6fdc9c;--inbg:#0f1830;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 "Barlow Semi Condensed",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px 12px 48px}
h1{font-size:26px;margin:4px 0 14px;font-weight:700}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
label.f{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:14px}
input,textarea{font:inherit;color:var(--ink);background:var(--inbg);border:1px solid var(--line);border-radius:6px;padding:8px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:860px}
th{background:var(--head);color:var(--headtx);font-weight:600;font-size:14px;padding:8px 6px;text-align:center;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1}
td{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:0;background:var(--paper)}
td:first-child{border-left:0;padding:8px 10px;font-weight:600;min-width:130px}
tr.sec td{background:var(--band);font-weight:700;padding:6px 10px;color:var(--ink)}
td input{width:100%;border:0;border-radius:0;background:transparent;padding:9px 6px;text-align:center;min-width:64px}
td input:focus-visible{outline-offset:-2px;background:var(--inbg)}
td input[type=date]{min-width:136px;font-size:14px}
td.tot{font-weight:700;text-align:center;font-variant-numeric:tabular-nums;font-size:18px;min-width:70px;color:var(--accent)}
td.tot.neg{color:var(--danger)}
td.tot input{color:inherit;font-weight:700;font-size:18px}
tr[data-manual="1"] td.tot input{text-decoration:underline dotted}
#tbl2{min-width:700px}
#rep{min-width:560px}
#rep td.c{padding:9px 6px;text-align:center;font-variant-numeric:tabular-nums}
#rep td.sold{font-weight:700;color:var(--accent);font-size:17px}
#rep td.sold.neg{color:var(--danger)}
#top{margin-bottom:10px;line-height:1.6}
td input.vr{background:rgba(180,35,24,.22)}
td input.vo{background:rgba(245,158,11,.28)}
#alerts{margin-bottom:14px}
.al{border-radius:8px;padding:10px 12px;border:1px solid var(--line);background:var(--paper)}
.al h3{margin:0 0 6px;font-size:17px}
.al ul{margin:0;padding-left:18px}
.al .r{color:var(--danger);font-weight:700}
.al .o{color:#b45309;font-weight:700}
.al.bad{border-color:var(--danger)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .al .o{color:#fbbf24}}
td.name input{text-align:left;font-weight:600;padding-left:10px}
.ob{margin-top:14px}.ob textarea{width:100%;min-height:70px;resize:vertical}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
button{font:600 15px inherit;font-family:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:10px 14px;cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] button.p,:root:not([data-theme="light"]) button.p{color:#0e1626}
button.d{color:var(--danger)}
h2{font-size:20px;margin:28px 0 8px}
.hist{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.item small{color:var(--muted);display:block}
.empty{color:var(--muted)}
#msg{color:var(--ok);min-height:22px;font-weight:600}
@media print{.bar,.hist,#hist-title,#msg{display:none}body{background:#fff;color:#000}.wrap{overflow:visible}}
</style>
</head>
<body>
<main>
<h1>Inventario diario</h1>
<div class="meta">
  <label class="f">Fecha de cuenta<input type="date" id="fecha"></label>
  <label class="f">Encargado<input type="text" id="enc" placeholder="Nombre del encargado"></label>
  <label class="f">Avisar vencimientos con (días)<input type="number" id="dias" min="1" max="365" inputmode="numeric"></label>
</div>
<div id="alerts" role="alert"></div>
<h2>1. Conteo de entrada</h2>
<div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
<h2>2. Conteo de salida</h2>
<div class="wrap"><table id="tbl2"><thead></thead><tbody></tbody></table></div>
<h2>3. Resumen del turno</h2>
<div id="top" class="al"></div>
<div class="wrap" style="margin-top:10px"><table id="rep"><thead><tr><th>Producto</th><th>Conteo de entrada</th><th>Llegó (paq.)</th><th>Conteo de salida</th><th>Salieron</th></tr></thead><tbody></tbody></table></div>
<div class="ob"><label class="f">OB (observaciones)<textarea id="ob"></textarea></label></div>
<div class="bar">
  <button class="p" id="save">Guardar registro</button>
  <button id="new">Nuevo registro</button>
  <button class="p" id="wa">Enviar PDF por WhatsApp</button>
  <button id="pdf">Descargar PDF</button>
  <button id="csv">Exportar CSV</button>
  <button id="print">Imprimir</button>
</div>
<div id="msg" role="status"></div>
<h2 id="hist-title">Registros guardados</h2>
<div class="hist" id="hist"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
var COLS=[["stock","Stock inicial","number"],["fv","Fecha venc.","date"],["ing","Ingresos (paq.)","number"],["paq","Unid. por paquete","number"],["fvi","Fecha venc. ingreso","date"],["lit","Litros","number"],["medio","Medio litro","number"]];
var SECS=[["Gaseosas",["Inca","Coca","Agua con gas","Agua sin gas"]],["Refrescos",["Maracuyá","Jamaica","Camu camu","Guayaba","Tapariba","Uva regional"]],["Extras",["Stella","",""," "]]];
var PACK={"Inca":12,"Coca":12,"Agua con gas":15,"Agua sin gas":15,"Stella":6};
var KEY="inventario:registros",CUR="inventario:borrador";
var $=function(s){return document.querySelector(s)};
function msg(t){$("#msg").textContent=t;setTimeout(function(){$("#msg").textContent=""},2500)}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function num(v){var n=parseFloat(String(v||"").replace(",","."));return isNaN(n)?0:n}
var mem=[];// respaldo si no hay almacenamiento

function build(){
  var h="<tr><th>Producto</th>"+COLS.map(function(c){return"<th>"+c[1]+"</th>"}).join("")+"<th>Total de producto</th></tr>";
  $("#tbl thead").innerHTML=h;
  var b="";
  SECS.forEach(function(s,si){
    b+='<tr class="sec"><td colspan="'+(COLS.length+2)+'">'+s[0]+"</td></tr>";
    s[1].forEach(function(n,ri){
      var id=si+"-"+ri,extra=s[0]==="Extras";
      b+='<tr data-id="'+id+'">';
      b+=extra?'<td class="name"><input data-f="name" placeholder="Producto extra" value="'+n.trim()+'"></td>':"<td>"+n+"</td>";
      COLS.forEach(function(c){b+='<td><input data-f="'+c[0]+'" type="'+c[2]+'" '+(c[2]==="number"?'inputmode="decimal" step="any"':"")+(c[0]==="paq"?' value="'+(PACK[n.trim()]||1)+'"':"")+' aria-label="'+c[1]+'"></td>'});
      b+='<td class="tot"><input data-f="total" type="text" inputmode="text" aria-label="Total de producto"></td></tr>';
    });
  });
  $("#tbl tbody").innerHTML=b;
}
function totals1(){
  document.querySelectorAll("tr[data-id]").forEach(function(tr){
    var g=function(f){return num(tr.querySelector('[data-f="'+f+'"]').value)};
    var t=g("stock")+g("ing")*(g("paq")||1)+g("lit")+g("medio");
    var td=tr.querySelector(".tot"),inp=td.querySelector("input");
    if(tr.dataset.manual!=="1"){var l=g("lit"),m=g("medio");if((l||m)&&!g("stock")&&!g("ing")){inp.value=(l+Math.floor(m/2))+"/"+(m%2)}else{inp.value=Math.round(t*100)/100}}
    td.classList.toggle("neg",num(inp.value)<0);markDates(tr);
  });
}
function collect(){
  var rows={};
  document.querySelectorAll("tr[data-id]").forEach(function(tr){
    var o={};tr.querySelectorAll("input").forEach(function(i){o[i.dataset.f]=i.value});
    o.manual=tr.dataset.manual||"";rows[tr.dataset.id]=o;
  });
  var sal={};
  document.querySelectorAll("tr[data-sid]").forEach(function(tr){
    var o={};tr.querySelectorAll("input").forEach(function(i){o[i.dataset.f]=i.value});
    o.manual=tr.dataset.manual||"";sal[tr.dataset.sid]=o;
  });
  return{fecha:$("#fecha").value,enc:$("#enc").value,ob:$("#ob").value,rows:rows,salida:sal};
}
function fill(d){
  $("#fecha").value=d.fecha||"";$("#enc").value=d.enc||"";$("#ob").value=d.ob||"";
  document.querySelectorAll("tr[data-id]").forEach(function(tr){
    var o=(d.rows||{})[tr.dataset.id]||{};tr.dataset.manual=o.manual||"";
    tr.querySelectorAll("input").forEach(function(i){i.value=o[i.dataset.f]!=null?o[i.dataset.f]:(i.dataset.f==="name"||i.dataset.f==="paq"?i.value:"")});
  });
  document.querySelectorAll("tr[data-sid]").forEach(function(tr){
    var o=(d.salida||{})[tr.dataset.sid]||{};tr.dataset.manual=o.manual||"";
    tr.querySelectorAll("input").forEach(function(i){i.value=o[i.dataset.f]!=null?o[i.dataset.f]:""});
  });
  totals();
}
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function totals(){totals1();totals2();renderReport()}
function build2(){
  var L={stock:"Quedan (unidades)",lit:"Litros",medio:"Medio litro",ing:"Llegó en el turno (paquetes)"};
  $("#tbl2 thead").innerHTML="<tr><th>Producto</th><th>Quedan (unid.)</th><th>Litros</th><th>Medio litro</th><th>Total final</th><th>Llegó en el turno (paq.)</th></tr>";
  var b="";
  SECS.forEach(function(s,si){
    b+='<tr class="sec"><td colspan="6">'+s[0]+"</td></tr>";
    s[1].forEach(function(n,ri){
      var id=si+"-"+ri;
      b+='<tr data-sid="'+id+'"><td data-nm="1">'+n.trim()+"</td>";
      ["stock","lit","medio"].forEach(function(f){b+='<td><input data-f="'+f+'" type="number" inputmode="decimal" step="any" aria-label="'+L[f]+'"></td>'});
      b+='<td class="tot"><input data-f="total" type="text" aria-label="Total final"></td>';
      b+=si===1?"<td></td>":'<td><input data-f="ing" type="number" inputmode="decimal" step="any" aria-label="'+L.ing+'"></td>';
      b+="</tr>";
    });
  });
  $("#tbl2 tbody").innerHTML=b;
}
function totals2(){
  document.querySelectorAll("tr[data-sid]").forEach(function(tr){
    var id=tr.dataset.sid;
    var src=document.querySelector('tr[data-id="'+id+'"] [data-f="name"]');
    if(src)tr.querySelector("[data-nm]").textContent=src.value;
    var get=function(f){var e=tr.querySelector('[data-f="'+f+'"]');return e?e.value:""};
    var any=["stock","lit","medio"].some(function(f){return get(f)!==""});
    var st=num(get("stock")),l=num(get("lit")),m=num(get("medio"));
    var td=tr.querySelector(".tot"),inp=td.querySelector("input");
    if(tr.dataset.manual!=="1"){
      if(!any){inp.value=""}
      else if((l||m)&&!st){inp.value=(l+Math.floor(m/2))+"/"+(m%2)}
      else{inp.value=Math.round((st+l+m)*100)/100}
    }
    td.classList.toggle("neg",num(inp.value)<0);
  });
}
function toBase(si,v){
  var s=String(v==null?"":v).trim();if(!s)return 0;
  if(si===1){if(s.indexOf("/")>-1){var p=s.split("/");return num(p[0])*2+num(p[1])}return num(s)*2}
  return num(s);
}
function showBase(si,x){
  if(si===1){var a=Math.abs(x);return(x<0?"-":"")+Math.floor(a/2)+"/"+(a%2)}
  return String(Math.round(x*100)/100);
}
function reportData(d){
  var out=[];
  SECS.forEach(function(s,si){s[1].forEach(function(n,ri){
    var id=si+"-"+ri,e=d.rows[id]||{},x=(d.salida||{})[id]||{};
    var nm=e.name!=null?e.name:n;if(e.name!=null&&!nm.trim())return;
    var tin=toBase(si,e.total),tout=toBase(si,x.total);
    var hasS=String(x.total||"").trim()!=="";
    if(!tin&&!hasS)return;
    var arr=si===1?0:num(x.ing)*(num(e.paq)||1);
    var sold=hasS?tin+arr-tout:null;
    out.push({si:si,nm:nm,ein:e.total||"",arrPaq:si===1?"":(x.ing||""),eout:x.total||"",sold:sold,soldTxt:sold===null?"":showBase(si,sold)});
  })});
  return out;
}
function summaryLines(r){
  var g=null,f=null,o=[],by={};
  r.forEach(function(i){
    by[i.si+"|"+i.nm]=i;
    if(i.sold===null||i.sold<=0)return;
    if(i.si===1){if(!f||i.sold>f.sold)f=i}else{if(!g||i.sold>g.sold)g=i}
  });
  o.push("Vendidos por producto:");
  SECS[0][1].forEach(function(n){var i=by["0|"+n];o.push("- "+n+": "+(i&&i.sold!==null?i.soldTxt+" unidades":"sin conteo de salida"))});
  r.forEach(function(i){if(i.si===0||i.sold===null)return;o.push("- "+i.nm+": "+i.soldTxt+(i.si===1?" (litros/medios)":" unidades"))});
  o.push("Más vendido: "+(g?g.nm+" ("+g.soldTxt+" unidades)":"sin datos"));
  o.push("Refresco más vendido: "+(f?f.nm+" ("+f.soldTxt+" litros/medios)":"sin datos"));
  return o;
}
function renderReport(){
  var d=collect(),r=reportData(d),b="",cur=-1;
  r.forEach(function(i){
    if(i.si!==cur){cur=i.si;b+='<tr class="sec"><td colspan="5">'+SECS[i.si][0]+"</td></tr>"}
    b+="<tr><td>"+esc(i.nm)+'</td><td class="c">'+esc(i.ein)+'</td><td class="c">'+esc(i.arrPaq)+'</td><td class="c">'+esc(i.eout)+'</td><td class="c sold'+(i.sold!==null&&i.sold<0?" neg":"")+'">'+i.soldTxt+"</td></tr>";
  });
  $("#rep tbody").innerHTML=b||'<tr><td colspan="5" class="empty" style="padding:12px">Llena el conteo de entrada y el de salida para ver cuánto salió.</td></tr>';
  var lines=summaryLines(r);
  $("#top").innerHTML="<strong>Resumen</strong><br>"+lines.map(esc).join("<br>");
}
var DIAS_KEY="inventario:dias";
function dias(){var n=parseInt(load(DIAS_KEY),10);return isNaN(n)?15:n}
function daysTo(f){if(!f)return null;var p=f.split("-");var a=new Date(+p[0],+p[1]-1,+p[2]);var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((a-t)/86400000)}
function lvl(n){if(n===null)return"";if(n<=3)return"r";if(n<=dias())return"o";return""}
function markDates(tr){["fv","fvi"].forEach(function(f){var i=tr.querySelector('[data-f="'+f+'"]');var l=lvl(daysTo(i.value));i.classList.toggle("vr",l==="r");i.classList.toggle("vo",l==="o")})}
function when(n){return n<0?"vencido hace "+(-n)+(n===-1?" día":" días"):n===0?"vence HOY":"vence en "+n+(n===1?" día":" días")}
function renderAlerts(){
  var el=$("#alerts"),l=all().slice();
  if(!l.length){el.innerHTML="";return}
  l.sort(function(a,b){return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:(b.actualizado||0)-(a.actualizado||0)});
  var seen={},items=[];
  l.forEach(function(rec){Object.keys(rec.rows||{}).forEach(function(id){
    if(seen[id])return;var r=rec.rows[id];
    if(!["stock","ing","lit","medio","fv","fvi"].some(function(k){return r[k]}))return;
    seen[id]=1;
    var p=id.split("-"),nm=r.name!=null?r.name:(SECS[p[0]]&&SECS[p[0]][1][p[1]]);
    if(!nm||!nm.trim())return;
    [["fv","Stock"],["fvi","Ingreso"]].forEach(function(x){var n=daysTo(r[x[0]]),lv=lvl(n);if(lv)items.push({nm:nm,t:x[1],f:r[x[0]],n:n,lv:lv})});
  })});
  items.sort(function(a,b){return a.n-b.n});
  if(!items.length){el.innerHTML='<div class="al"><h3>\u2705 Sin vencimientos cercanos</h3>Se revisan los pr\u00f3ximos '+dias()+' d\u00edas.</div>';return}
  el.innerHTML='<div class="al bad"><h3>\u26a0\ufe0f Fechas de vencimiento por revisar ('+items.length+')</h3><ul>'+items.map(function(i){return'<li class="'+i.lv+'">'+i.nm.replace(/</g,"&lt;")+" ("+i.t+"): "+fmt(i.f)+" \u2014 "+when(i.n)+"</li>"}).join("")+"</ul></div>";
}
function all(){return mem}
window.setRegistros=function(l){mem=l;renderHist()};
function rid(d){return d.fecha+"_"+d.enc.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-")}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(f){if(!f)return"Sin fecha";var p=f.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function renderHist(){
  renderAlerts();var l=all(),el=$("#hist");
  if(!l.length){el.innerHTML='<p class="empty">Todavía no hay registros. Llena la hoja y toca «Guardar registro».</p>';return}
  el.innerHTML=l.map(function(r,i){return'<div class="item"><div><strong>'+fmt(r.fecha)+"</strong><small>"+(r.enc||"Sin encargado").replace(/</g,"&lt;")+'</small></div><div><button data-open="'+i+'">Abrir</button> <button class="d" data-del="'+i+'">Eliminar</button></div></div>'}).join("");
}
document.addEventListener("input",function(e){if(e.target.closest("#tbl,#tbl2")){var tr=e.target.closest("tr");if(e.target.dataset.f==="total"){tr.dataset.manual=e.target.value===""?"":"1"}totals()}store(CUR,collect())});
$("#save").onclick=function(){
  var d=collect();
  if(!d.fecha){msg("Elige la fecha de cuenta antes de guardar.");$("#fecha").focus();return}
  if(!d.enc.trim()){msg("Escribe el nombre del encargado antes de guardar.");$("#enc").focus();return}
  if(!window.DB){msg("Falta conectar la base de datos. Revisa la configuraci\u00f3n de Firebase.");return}
  d.id=rid(d);
  if(all().some(function(r){return r.id===d.id})&&!confirm("Ya existe un registro de este encargado en esa fecha. \u00bfReemplazarlo?"))return;
  window.DB.save(d).then(function(){msg("Registro guardado para todos.")},function(){msg("No se pudo guardar. Revisa la conexi\u00f3n.")});
};
$("#new").onclick=function(){if(!confirm("¿Empezar un registro nuevo? Se limpia la hoja actual."))return;fill({fecha:today()});store(CUR,collect())};
$("#hist").onclick=function(e){
  var o=e.target.dataset.open,d=e.target.dataset.del,l=all().slice();
  if(o!=null){fill(l[o]);window.scrollTo({top:0,behavior:"smooth"})}
  if(d!=null&&confirm("¿Eliminar este registro para todos?")&&window.DB){window.DB.del(l[d].id).then(function(){msg("Registro eliminado.")},function(){msg("No se pudo eliminar.")})}
};
$("#print").onclick=function(){window.print()};
$("#csv").onclick=function(){
  var d=collect(),head=["Fecha","Encargado","Producto"].concat(COLS.map(function(c){return c[1]}),["Total"]),out=[head];
  var names=[];SECS.forEach(function(s,si){s[1].forEach(function(n,ri){names.push([si+"-"+ri,n])})});
  names.forEach(function(p){var r=d.rows[p[0]];var nm=r.name!=null?r.name:p[1];if(r.name!=null&&!nm.trim())return;
    out.push([d.fecha,d.enc,nm].concat(COLS.map(function(c){return r[c[0]]||""}),[r.total]))});

function pdfFile(){
  var J=window.jspdf;if(!J)return null;
  var d=collect(),doc=new J.jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  doc.setFontSize(16);doc.text("Inventario diario",40,40);

    body.push([{content:s[0],colSpan:COLS.length+2,styles:{fillColor:[214,226,245],fontStyle:"bold",textColor:20,halign:"left"}}]);
    s[1].forEach(function(n,k){
      var r=d.rows[si+"-"+k],nm=r.name!=null?r.name:n;
      if(r.name!=null&&!nm.trim())return;
      body.push([nm].concat(COLS.map(function(c){var v=r[c[0]]||"";return c[2]==="date"&&v?fmt(v):v}),[r.total||""]));
    });
  });
  var hs={fillColor:[44,74,138]},st={fontSize:9,halign:"center"},cs={0:{halign:"left",fontStyle:"bold"}};
  var secRow=function(t,n){return[{content:t,colSpan:n,styles:{fillColor:[214,226,245],fontStyle:"bold",textColor:20,halign:"left"}}]};
  doc.setFontSize(12);doc.text("1. Conteo de entrada",40,84);
  doc.autoTable({startY:90,head:[["Producto"].concat(COLS.map(function(c){return c[1]}),["Total"])],body:body,styles:st,columnStyles:cs,headStyles:hs});
  var y=doc.lastAutoTable.finalY+28;
  var body2=[];
  SECS.forEach(function(s,si){
    var rb=[];
    s[1].forEach(function(n,k){
      var id=si+"-"+k,e=d.rows[id]||{},x=(d.salida||{})[id]||{},nm=e.name!=null?e.name:n;
      if(e.name!=null&&!nm.trim())return;
      if(!(x.stock||x.lit||x.medio||x.total||x.ing))return;
      rb.push([nm,x.stock||"",x.lit||"",x.medio||"",x.total||"",x.ing||""]);
    });
    if(rb.length){body2.push(secRow(s[0],6));rb.forEach(function(r){body2.push(r)})}
  });
  if(y>470){doc.addPage();y=50}
  doc.setFontSize(12);doc.text("2. Conteo de salida",40,y);
  doc.autoTable({startY:y+6,head:[["Producto","Quedan (unid.)","Litros","Medio litro","Total final","Llegó (paq.)"]],body:body2.length?body2:[["Sin datos","","","","",""]],styles:st,columnStyles:cs,headStyles:hs});
  y=doc.lastAutoTable.finalY+28;
  var rd=reportData(d),body3=[],cur=-1;
  rd.forEach(function(i){
    if(i.si!==cur){cur=i.si;body3.push(secRow(SECS[i.si][0],5))}
    body3.push([i.nm,i.ein,i.arrPaq,i.eout,i.soldTxt]);
  });
  if(y>440){doc.addPage();y=50}
  doc.setFontSize(12);doc.text("3. Resumen del turno",40,y);
  doc.autoTable({startY:y+6,head:[["Producto","Conteo de entrada","Llegó (paq.)","Conteo de salida","Salieron"]],body:body3.length?body3:[["Sin datos","","","",""]],styles:st,columnStyles:{0:{halign:"left",fontStyle:"bold"},4:{fontStyle:"bold"}},headStyles:hs});
  y=doc.lastAutoTable.finalY+22;
  if(y>500){doc.addPage();y=50}
  doc.setFontSize(10);
  var arr=[];
  summaryLines(rd).concat(["OB: "+(d.ob||"")]).forEach(function(t){arr=arr.concat(doc.splitTextToSize(t,760))});
  doc.text(arr,40,y);
  return{blob:doc.output("blob"),name:"inventario-"+d.fecha+".pdf"};
}
function getPdf(){

  return f;
}
function savePdf(f){
  var C=window.claude;if(!C||!C.use){var a=document.createElement("a");a.href=URL.createObjectURL(f.blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove();msg("PDF listo.");return}
  C.use("downloads").then(function(dl){
    if(!dl){msg("Aquí no se puede descargar. Usa Imprimir y guarda como PDF.");return}
    return dl.save({filename:f.name,data:f.blob}).then(function(){msg("PDF listo.")},function(e){if(!e||e.code!=="declined")msg("No se pudo guardar el PDF.")});
  });
}
$("#pdf").onclick=function(){var f=getPdf();if(f)savePdf(f)};
$("#wa").onclick=function(){
  var f=getPdf();if(!f)return;
  var file=new File([f.blob],f.name,{type:"application/pdf"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"Inventario "+fmt($("#fecha").value)}).catch(function(e){if(!e||e.name!=="AbortError")savePdf(f)});
  }else{savePdf(f)}
};
